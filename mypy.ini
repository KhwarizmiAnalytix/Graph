# Graph mypy.ini — referenced by the MYPY linter in .lintrunner.toml.
# Scoped to this single-module repo's Python (Scripts/); Scripts/setup.py is
# excluded here and in .lintrunner.toml (defensive locals()/re-match patterns
# false-positive under mypy).

[mypy]
cache_dir = .mypy_cache/normal
allow_redefinition = True
warn_unused_configs = True
warn_redundant_casts = True
show_error_codes = True
show_column_numbers = True
check_untyped_defs = True
follow_imports = normal
local_partial_types = True
enable_error_code = possibly-undefined
warn_unused_ignores = False

files =
    Scripts

exclude = Scripts/setup.py

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-coverage_tool.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True
