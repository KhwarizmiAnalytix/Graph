    '.vscode/**',
    '.git/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.cmake_linter',
    '--config=.cmakelintrc',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--dry-run={{DRYRUN}}',
    'cmakelint==1.4.1',
]

