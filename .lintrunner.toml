# Comprehensive Linting Configuration for KhwarizmiAnalytix Ecosystem
# Includes all 32 linting checks across C++, Python, CMake, and CI/CD
# Based on XSigma standards and lint-tool adapters

# ==============================================================================
# C++ FORMATTING & ANALYSIS
# ==============================================================================

[[linter]]
code = 'CLANGFORMAT'
include_patterns = [
    'include/**/*.h',
    'include/**/*.hpp',
    'include/**/*.hxx',
    'include/**/*.cpp',
    'include/**/*.cxx',
    'include/**/*.c',
    'Testing/**/*.h',
    'Testing/**/*.cpp',
    'Tests/**/*.h',
    'Tests/**/*.cpp',
    'src/**/*.h',
    'src/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.s3_init',
    '--linter=clang-format',
    '--dry-run={{DRYRUN}}',
    '--output-dir=.lintbin',
    '--output-name=clang-format',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.clangformat_linter',
    '--binary=.lintbin/clang-format',
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'CLANGTIDY'
include_patterns = [
    'include/**/*.h',
    'include/**/*.hpp',
    'include/**/*.cpp',
    'include/**/*.cxx',
    'Testing/**/*.h',
    'Testing/**/*.cpp',
    'Tests/**/*.h',
    'Tests/**/*.cpp',
]
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.clangtidy_linter',
    '--binary=clang-tidy',
    '--',
    '@{{PATHSFILE}}',
]

