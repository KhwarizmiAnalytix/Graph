[[linter]]
code = 'CODESPELL'
command = [
    'python3',
    '-m',
    'lint_tool.adapters.codespell_linter',
    '--',
    '@{{PATHSFILE}}'
]
include_patterns = [
    '**',
]
exclude_patterns = [
    '.lintrunner.toml',
    'ThirdParty/**',
    '**/third_party/**',
    '**/3rdparty/**',
    '**/experimental/**',
    '**/Experimental/**',
    '.vscode/**',
    '.git/**',
]
init_command = [
    'python3',
    '-m',
    'lint_tool.adapters.pip_init',
    '--dry-run={{DRYRUN}}',
    'codespell[toml]==2.4.1',
]
is_formatter = false

[[linter]]
code = 'LINTRUNNER_VERSION'
