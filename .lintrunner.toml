# ==============================================================================
# WHITESPACE & FORMATTING
# ==============================================================================

[[linter]]
code = 'NEWLINE'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '**/*.png',
    '**/*.ico',
    '**/*.o',
    '**/*.a',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.newlines_linter',
    '--',
    '@{{PATHSFILE}}',
]
is_formatter = true

[[linter]]
code = 'SPACES'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '**/*.png',
    '**/*.ico',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '--pattern=[[:blank:]]$',
    '--linter-name=SPACES',
    '--error-name=trailing spaces',
    '--replace-pattern=s/[[:blank:]]+$//',
    '--error-description=This line has trailing spaces; please remove them.',
    '--',
    '@{{PATHSFILE}}',
]

[[linter]]
code = 'TABS'
include_patterns = ['**']
exclude_patterns = [
    'ThirdParty/**',
    '.git/**',
    'bazel-*/**',
    'build/**',
    'build_*/**',
    '.gitmodules',
    'Makefile',
]
command = [
    'python3',
    '-m',
    'lint_tool.adapters.grep_linter',
    '--pattern=	',
    '--linter-name=TABS',
    '--error-name=tabs in code',
    '--replace-pattern=s/	/  /g',
    '--error-description=Please use spaces instead of tabs.',
    '--',
    '@{{PATHSFILE}}',
]

