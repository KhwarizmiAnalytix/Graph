name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [clang, gcc]
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: windows-latest
            compiler: gcc
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir build
          cd build
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator Ninja --build-type=Release --c-compiler=${{ matrix.compiler }} --cxx-compiler=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} --source-dir .. --build-dir .

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir build
          cd build
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator "Ninja" --build-type=Release --c-compiler=clang --cxx-compiler=clang++ --source-dir .. --build-dir .

      - name: Build
        run: |
          cd build
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir . --build-type Release

      - name: Run tests
        run: |
          cd build
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir .

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install lintrunner
        run: |
          pip install lint-tool

      - name: Run lintrunner
        run: |
          python3 -m lintrunner --version
          python3 -m lintrunner init
          python3 -m lintrunner run --show-stats

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --install-prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --benchmark=OFF
          --coverage=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --benchmark=OFF
          --coverage=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Compiler cache (ccache/sccache) and Icecream (icecc) coverage across
  # Linux, macOS, and Windows. BuildCache runs in buildcache.yml. Icecc has
  # no Windows port, so there is no windows-icecc entry.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache & Icecc / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: linux-sccache
            os: ubuntu-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            sccache: true
          - name: linux-icecc
            os: ubuntu-latest
            cmake_flags: --icecc=ON
          - name: macos-ccache
            os: macos-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: macos-sccache
            os: macos-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            sccache: true
          - name: macos-icecc
            os: macos-latest
            cmake_flags: --icecc=ON
          - name: windows-ccache
            os: windows-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: windows-sccache
            os: windows-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            sccache: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang ccache icecc

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja ccache icecream

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja ccache -y

      - name: Set up sccache
        if: matrix.sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.12.0

      - name: Configure
        run: python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja --build-type=Release ${{ matrix.cmake_flags }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Run tests
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Stop the job-local cache server
        if: always() && matrix.sccache
        shell: bash
        run: python3 -c "import shutil, subprocess; shutil.which('sccache') and subprocess.run(['sccache', '--stop-server'], check=False)"
