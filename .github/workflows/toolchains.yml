name: Setup helpers and compiler toolchains

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.2 ninja
      - name: Check setup failure handling and documented setup options
        run: python -m unittest discover -s Testing/CMake -p test_setup_cli.py -v

  windows:
    name: Windows / ${{ matrix.compiler }} / ${{ matrix.build_type }} / Ninja
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang, clang-cl]
        build_type: [Debug, Release]
        include:
          - compiler: msvc
            cc: cl
            cxx: cl
          - compiler: clang
            cc: clang
            cxx: clang++
          - compiler: clang-cl
            cc: clang-cl
            cxx: clang-cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python -m pip install cmake==4.1.2 ninja
      - name: Configure the selected compiler with Ninja
        run: >
          python Scripts/setup.py config --compiler=default --source-dir . --build-dir build-toolchain --generator Ninja
          --c-compiler=${{ matrix.cc }}
          --cxx-compiler=${{ matrix.cxx }}
          --build-type=${{ matrix.build_type }}
          --testing=ON
          --benchmark=OFF
      - name: Verify the effective compiler and generator
        run: python Scripts/setup.py verifytoolchain --build-dir build-toolchain --compiler ${{ matrix.compiler }}
      - name: Build
        run: python Scripts/setup.py build --build-dir build-toolchain --build-type ${{ matrix.build_type }} --parallel 4
      - name: Test
        run: python Scripts/setup.py test --build-dir . --build-dir build-toolchain --build-type ${{ matrix.build_type }} --test-timeout 300

  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }} / Ninja
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.2 ninja
      - name: Configure the selected compiler with Ninja
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-toolchain --generator Ninja
          --c-compiler=${{ matrix.cc }}
          --cxx-compiler=${{ matrix.cxx }}
          --build-type=${{ matrix.build_type }}
          --testing=ON
          --benchmark=OFF
      - name: Verify the effective compiler and generator
        run: python3 Scripts/setup.py verifytoolchain --build-dir build-toolchain --compiler ${{ matrix.compiler }}
      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-toolchain --build-type ${{ matrix.build_type }} --parallel 4
      - name: Test
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-toolchain --build-type ${{ matrix.build_type }} --test-timeout 300

  macos:
    name: macOS / Clang / ${{ matrix.generator }} / ${{ matrix.build_type }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        generator: [Ninja, Xcode]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==4.1.2 ninja
      - name: Configure AppleClang with the selected generator
        run: >
          python3 Scripts/setup.py config --compiler=default --source-dir . --build-dir build-toolchain --generator ${{ matrix.generator }}
          --build-type=${{ matrix.build_type }}
          --testing=ON
          --benchmark=OFF
      - name: Verify the effective compiler and generator
        run: python3 Scripts/setup.py verifytoolchain --build-dir build-toolchain --compiler clang --generator ${{ matrix.generator }}
      - name: Build
        run: python3 Scripts/setup.py build --build-dir build-toolchain --build-type ${{ matrix.build_type }} --parallel 4
      - name: Test
        run: python3 Scripts/setup.py test --build-dir . --build-dir build-toolchain --build-type ${{ matrix.build_type }} --test-timeout 300
