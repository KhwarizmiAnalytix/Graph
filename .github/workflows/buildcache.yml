name: BuildCache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildcache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildcache:
    name: BuildCache / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install CMake and Ninja
        run: python -m pip install cmake==4.1.2 ninja

      - name: Set cache directory
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Build pinned BuildCache
        shell: bash
        run: python .github/scripts/install_buildcache.py --install-prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Check MSVC debug flag regression
        run: python -m unittest discover -s Testing/CMake -p test_platform.py -v

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cache=ON
          --cache-backend=buildcache
          --testing=ON
          --benchmark=OFF

      - name: Verify launcher and clean rebuild cache hits
        run: python Scripts/setup.py verifycache --build-dir build --target Graph --parallel 4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release --test-timeout 300

      - name: Report cache statistics
        if: always()
        run: buildcache --show-stats
