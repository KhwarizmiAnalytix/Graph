# Graph mypy-strict.ini — referenced by the MYPYSTRICT linter in
# .lintrunner.toml. Enforces strict typing on the build scripts; Scripts/setup.py
# is excluded (see .lintrunner.toml).

[mypy]
cache_dir = .mypy_cache/strict
allow_redefinition = True
strict_optional = True
show_error_codes = True
show_column_numbers = True
warn_no_return = True

strict = True
implicit_reexport = False
warn_unused_ignores = False

files =
    Scripts

exclude = Scripts/setup.py

[mypy-colorama.*]
ignore_missing_imports = True

[mypy-coverage_tool.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True
